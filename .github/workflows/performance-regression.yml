name: Performance Regression Detection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-budget:
    name: Critical-path performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm build
      - name: Start production server
        run: |
          pnpm start > /tmp/agritrust-next.log 2>&1 &
          echo $! > /tmp/agritrust-next.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/agritrust-next.log
          exit 1
      - name: Collect repeatable Lighthouse samples
        run: pnpm dlx @lhci/cli@0.13.x collect --config=lighthouserc.js --collect.numberOfRuns=3
      - name: Enforce performance budgets
        run: node scripts/check-performance-budget.mjs
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-performance-reports
          path: .lighthouseci
          if-no-files-found: warn
          retention-days: 30
      - name: Stop production server
        if: always()
        run: kill "$(cat /tmp/agritrust-next.pid)" || true
