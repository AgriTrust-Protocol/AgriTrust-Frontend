apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: agritrust-strict-mtls
  namespace: agritrust
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: agritrust-frontend
  namespace: agritrust
spec:
  host: agritrust-frontend.agritrust.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http: { http1MaxPendingRequests: 100, maxRequestsPerConnection: 100 }
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: stable
      labels: { track: stable }
    - name: canary
      labels: { track: canary }
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: agritrust-frontend
  namespace: agritrust
spec:
  hosts: ["agritrust.example.com"]
  gateways: ["istio-system/public-gateway"]
  http:
    - timeout: 10s
      retries: { attempts: 2, perTryTimeout: 3s, retryOn: connect-failure,refused-stream,5xx }
      route:
        - destination: { host: agritrust-frontend.agritrust.svc.cluster.local, subset: stable, port: { number: 80 } }
          weight: 100
        - destination: { host: agritrust-frontend.agritrust.svc.cluster.local, subset: canary, port: { number: 80 } }
          weight: 0
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agritrust-frontend-ingress-only
  namespace: agritrust
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agritrust-frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
      to:
        - operation:
            ports: ["3000"]
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: agritrust-frontend-metrics
  namespace: agritrust
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agritrust-frontend
  metrics:
    - providers: [{ name: prometheus }]
      overrides:
        - match: { metric: ALL_METRICS }
          tagOverrides:
            destination_track:
              operation: UPSERT
              value: "%{DESTINATION_WORKLOAD_LABELS['track']}"
