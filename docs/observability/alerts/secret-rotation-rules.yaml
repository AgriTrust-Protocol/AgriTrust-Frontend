groups:
  - name: secret-rotation
    rules:
      - alert: SecretRotationFailure
        expr: increase(secret_rotation_failure_total[5m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: Secret rotation failed or rolled back
      - alert: SecretRotationCriticalPathLatency
        expr: secret_rotation_p99_latency_ms{critical_path="true"} > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Secret rotation critical path P99 exceeds 100ms
      - alert: SecretRotationErrorBudget
        expr: secret_rotation_error_rate > 0.001
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Secret rotation error budget exceeded
